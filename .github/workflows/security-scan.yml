name: Aegis Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # Dogfooding: scan this repository with its own action (action.yml)
      - name: Run Aegis Security Scanner
        uses: ./
        with:
          target_path: '.'
          # The test suite contains intentionally vulnerable fixtures, so findings are
          # reported to the Security tab without failing the build
          fail_on_critical: 'false'
          ai_filter: 'false'
