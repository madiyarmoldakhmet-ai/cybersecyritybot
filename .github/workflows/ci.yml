name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"  # same as the Docker image; strix-agent requires 3.12+
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Build image
        run: docker build -t commit-guardian:ci .

      - name: Start container
        run: docker run -d --name guardian -p 8000:8000 commit-guardian:ci

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/dashboard -o /dev/null; then break; fi
            sleep 2
          done
          python3 - <<'PY'
          import json
          import urllib.request

          dash = urllib.request.urlopen("http://localhost:8000/dashboard", timeout=10).read().decode("utf-8")
          assert "Мониторинг безопасности" in dash

          metrics = json.loads(urllib.request.urlopen("http://localhost:8000/api/v1/dashboard/metrics", timeout=10).read())
          assert metrics["total_scans"] == 0, metrics

          req = urllib.request.Request(
              "http://localhost:8000/api/v1/webhook/github",
              data=b"{}",
              headers={"X-GitHub-Event": "ping", "Content-Type": "application/json"},
              method="POST",
          )
          pong = json.loads(urllib.request.urlopen(req, timeout=10).read())
          assert pong["status"] == "ok", pong
          PY

      - name: Container logs
        if: always()
        run: docker logs guardian
