name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"  # same as the Docker image; strix-agent requires 3.12+
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Build image
        run: docker build -t commit-guardian:ci .

      - name: Start container
        run: docker run -d --name guardian -p 8000:8000 commit-guardian:ci

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/dashboard -o /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/dashboard | grep -q "Мониторинг безопасности"
          curl -fsS http://localhost:8000/api/v1/dashboard/metrics | python3 -c "import json,sys; m=json.load(sys.stdin); assert m['total_scans'] == 0, m"
          curl -fsS -X POST http://localhost:8000/api/v1/webhook/github \
            -H "X-GitHub-Event: ping" -H "Content-Type: application/json" -d '{}' | grep -q '"status":"ok"'

      - name: Container logs
        if: always()
        run: docker logs guardian
